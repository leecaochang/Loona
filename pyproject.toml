[project]
name = "loona"
version = "0.3.0"
requires-python = ">=3.14.2"
dependencies = []

[project.optional-dependencies]
test = [
    "homeassistant==2026.9.4",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pyflakes==4.0.0",
    "mypy==2.3.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.14"
follow_imports = "silent"
check_untyped_defs = true
