[project]
name = "loona"
version = "0.9.5"
requires-python = ">=3.12.0"
dependencies = []

[project.optional-dependencies]
test = [
    "homeassistant==2026.9.4",
    "home-assistant-frontend==20260826.7",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pyflakes==4.0.0",
    "mypy==2.3.1",
    "aiohttp==3.14.3",
    "PyYAML==6.0.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.14"
follow_imports = "silent"
check_untyped_defs = true
